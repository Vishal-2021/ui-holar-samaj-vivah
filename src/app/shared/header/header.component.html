<!-- =========================================================
     HOLAR SAMAJ VIVAH NAVBAR
========================================================= -->

<nav class="navbar">

  <!-- ================= LOGO ================= -->

  <a routerLink="/" class="brand" (click)="closeMenu()">

    <div class="brand-icon">
      ♥
    </div>

    <div class="brand-text">
      <span class="brand-main">Holar Samaj</span>
      <span class="brand-sub">Vivah</span>
    </div>

  </a>


  <!-- ================= HAMBURGER ================= -->

  <button
    type="button"
    class="hamburger"
    (click)="toggleMenu()"
    [attr.aria-expanded]="menuOpen"
    aria-label="Toggle navigation">

    <span></span>
    <span></span>
    <span></span>

  </button>


  <!-- ================= NAVIGATION ================= -->

  <ul
  class="nav-links"
  [class.active]="menuOpen">

  <!-- Home -->
  <li>
    <a
      routerLink="/"
      (click)="closeMenu()">
      <i class="fa-solid fa-house nav-icon"></i>
      <span>Home</span>
    </a>
  </li>

  <!-- Search -->
  <li>
    <a
      routerLink="/profile-search"
      (click)="closeMenu()">
      <i class="fa-solid fa-magnifying-glass nav-icon"></i>
      <span>Search</span>
    </a>
  </li>

  <!-- Login -->
  <li *ngIf="!authService.isLoggedIn()">
    <a
      routerLink="/login"
      class="login"
      (click)="closeMenu()">
      <i class="fa-solid fa-right-to-bracket nav-icon"></i>
      <span>Login</span>
    </a>
  </li>

  <!-- Registration -->
  <li *ngIf="!authService.isLoggedIn()">
    <a
      routerLink="/register"
      class="btn"
      (click)="closeMenu()">
      <i class="fa-solid fa-user-plus nav-icon"></i>
      <span>Registration</span>
    </a>
  </li>

  <!-- Messages -->
  <li *ngIf="authService.isLoggedIn()">
    <a
      routerLink="/messages"
      (click)="closeMenu()">
      <i class="fa-solid fa-comments nav-icon"></i>
      <span>Messages</span>
    </a>
  </li>

  <!-- Interests -->
  <li *ngIf="authService.isLoggedIn()">
    <a
      routerLink="/interests"
      (click)="closeMenu()">
      <i class="fa-solid fa-heart nav-icon"></i>
      <span>Interests</span>
    </a>
  </li>

  <!-- Profile -->
  <li *ngIf="authService.isLoggedIn()">
    <a
      routerLink="/profile"
      (click)="closeMenu()">
      <i class="fa-solid fa-circle-user nav-icon"></i>
      <span>My Profile</span>
    </a>
  </li>

  <!-- Subscription -->
  <li *ngIf="authService.isLoggedIn()">
    <a
      routerLink="/subscription"
      (click)="closeMenu()">
      <i class="fa-solid fa-crown nav-icon"></i>
      <span>Membership</span>
    </a>
  </li>

  <!-- Logout -->
  <li *ngIf="authService.isLoggedIn()">
    <a
      class="btn logout-btn"
      (click)="logout()">
      <i class="fa-solid fa-right-from-bracket nav-icon"></i>
      <span>Logout</span>
    </a>
  </li>

</ul>

</nav>
